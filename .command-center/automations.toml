## Repo-local automatic triggers require one manual approval run.

[[automations]]
id = "fmt"
title = "fmt"
command = "nix develop . --command cargo fmt"
trigger = "manual"
confirm = true
timeout_sec = 600

[[automations]]
id = "clippy"
title = "clippy (all targets)"
command = "nix develop . --command cargo clippy --all-targets --all-features -D warnings"
trigger = "on_phase_diff"
only_if_dirty = true
confirm = false
timeout_sec = 900
max_parallel = 1

[[automations]]
id = "test"
title = "tests"
command = "nix develop . --command cargo test"
trigger = "on_phase_apply"
confirm = false
timeout_sec = 1200
max_parallel = 1

[[automations]]
id = "check"
title = "check (workspace)"
command = "nix develop . --command cargo check --all-targets"
trigger = "on_stream_end"
only_if_dirty = true
confirm = false
timeout_sec = 600
max_parallel = 1

[[automations]]
id = "review-security"
title = "review security (uncommitted)"
command = "codex exec -o .command-center/review-security.md review --uncommitted -m gpt-5.3-codex -c model_reasoning_effort=high -c model_verbosity=medium -c model_instructions_file=.command-center/skills/security-review.md"
trigger = "manual"
only_if_dirty = true
confirm = true
timeout_sec = 1800
max_parallel = 1

