[package]
name = "ratatosk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
mimalloc = ["dep:mimalloc", "ratatosk-engine/mimalloc"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Experimental shared-memory transport (Unix only). See docs/shm-transport.md.
shm-transport = ["dep:ratatosk-shm"]

[dependencies]
ratatosk-core = { workspace = true }
ratatosk-resp = { workspace = true }
ratatosk-engine = { workspace = true }
ratatosk-shm = { workspace = true, optional = true }
libc = { workspace = true }
ratatosk-persist = { workspace = true }
bytes = { workspace = true }
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
mio = { workspace = true }
tokio = { workspace = true }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
fs2 = { workspace = true }

[dev-dependencies]
ratatosk-shm = { workspace = true }
criterion = { workspace = true }
hashbrown = { workspace = true }
ratatosk-resp = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "ratatosk_server"
path = "src/lib.rs"

[[bin]]
name = "ratatosk"
path = "src/main.rs"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "hotpaths"
harness = false

[[bench]]
name = "comprehensive"
harness = false
