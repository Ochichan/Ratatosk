[workspace]
members = [
    "crates/ratatosk-core",
    "crates/ratatosk-resp",
    "crates/ratatosk-engine",
    "crates/ratatosk-persist",
    "crates/ratatosk-server",
]
resolver = "3"

[workspace.metadata.crane]
name = "ratatosk"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Internal
ratatosk-core = { path = "crates/ratatosk-core" }
ratatosk-resp = { path = "crates/ratatosk-resp" }
ratatosk-engine = { path = "crates/ratatosk-engine" }
ratatosk-persist = { path = "crates/ratatosk-persist" }
ratatosk-server = { path = "crates/ratatosk-server" }

# Zero-Copy fundamentals
bytes = "1"

# Allocator experiments
mimalloc = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async / Event loop
tokio = { version = "1", features = ["full"] }
mio = { version = "1", features = ["os-poll", "net"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }

# Concurrency
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Data structures
hashbrown = "0.15"
smallvec = { version = "1", features = ["union"] }

# CRC / integrity
crc = "3"

# Memory-mapped files
memmap2 = "0.9"

# Temp files
tempfile = "3"
fs2 = "0.4"

# Random
rand = "0.8"
sha2 = "0.10"

# Password hashing
argon2 = "0.5"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Glob pattern matching (pub/sub)
glob-match = "0.2"

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }
itoa = "1"
memchr = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
opt-level = 3

[profile.dev.package.ratatosk-resp]
opt-level = 3

[profile.dev.package.ratatosk-engine]
opt-level = 3
