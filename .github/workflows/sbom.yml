name: SBOM

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-cyclonedx
            ~/.cargo/registry
            ~/.cargo/git
          key: sbom-tools-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sbom-tools-${{ runner.os }}-

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all

      - name: Collect SBOM files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom
          found=0
          while IFS= read -r -d '' file; do
            cp "$file" "sbom/$(echo "$file" | sed 's@^\./@@; s@/@__@g')"
            found=1
          done < <(find . -name '*.cdx.json' -not -path './sbom/*' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "no CycloneDX SBOM files were generated" >&2
            exit 1
          fi
          ls -l sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratatosk-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom/*.cdx.json
