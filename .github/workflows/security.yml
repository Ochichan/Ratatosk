name: Security

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # New advisories land without any change to this repository.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Current month
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
          # A cache key is never overwritten, so a fixed key would keep the
          # first cargo-deny/cargo-audit build and rebuild on every run after
          # an upgrade. Rotating monthly re-saves the current tools.
          key: security-tools-${{ runner.os }}-${{ steps.month.outputs.value }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo deny
        run: cargo deny check advisories bans licenses sources

      - name: Cargo audit
        run: cargo audit

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --no-git --source=. --config=.gitleaks.toml
