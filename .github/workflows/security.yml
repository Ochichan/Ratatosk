name: Security

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # New advisories land without any change to this repository.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Current month
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
          # A cache key is never overwritten, so a fixed key would keep the
          # first cargo-deny/cargo-audit build and rebuild on every run after
          # an upgrade. Rotating monthly re-saves the current tools.
          key: security-tools-${{ runner.os }}-${{ steps.month.outputs.value }}

      # The cache restores the binaries, and `cargo install` refuses to overwrite them.
      - name: Install cargo-deny
        run: |
          if ! cargo deny --version >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi

      - name: Install cargo-audit
        run: |
          if ! cargo audit --version >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: Cargo deny
        run: cargo deny check advisories bans licenses sources

      - name: Cargo audit
        run: cargo audit

      # gitleaks-action ignores `args` and needs a token on pull requests, so run
      # the pinned CLI against the checked-out tree with the repository config.
      - name: Gitleaks secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, pinned so a replaced
          # release asset fails the check instead of being trusted.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
