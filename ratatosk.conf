# Ratatosk configuration file
# Auto-loaded from ./ratatosk.conf when present.
# Environment variables override file values.

# Network
bind 127.0.0.1
port 6379
maxclients 4096
timeout 0
client-timeout-sec 0
output-buffer-limit-bytes 8388608
shutdown-grace-ms 10000

# Compatibility
# compat (default): unsupported / syntax-only commands are accepted as no-ops.
# strict: commands Ratatosk only accepts syntactically, plus WAIT/WAITAOF (which
#   imply replica-backed acknowledgement a single node cannot honour), return a
#   structured error instead of a misleading success. See docs/PRODUCT_CONTRACT.md.
compatibility-mode compat

# Security
# protected-mode yes (default): a non-loopback bind refuses to start while the
#   `default` ACL user is still nopass, unless you supply a bootstrap password
#   (RATATOSK_DEFAULT_USER_PASSWORD / RATATOSK_DEFAULT_USER_PASSWORD_HASH).
# protected-mode no: explicitly insecure opt-out (equivalent to
#   RATATOSK_ALLOW_DEFAULT_USER_NOPASS=true). See docs/PRODUCT_CONTRACT.md.
protected-mode yes

# Persistence
dir .
dbfilename dump.rdb
appendonly no
appendfsync everysec
save 3600 1 300 100 60 10000

# Memory management
maxmemory 0
maxmemory-policy noeviction
maxmemory-samples 5
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
lazyfree-lazy-user-del no

# Runtime
hz 10
active-expire-cycle-lookups 20
active-expire-cycle-threshold-pct 25
query-buffer-limit 1048576
output-buffer-flush-threshold 16384
client-write-timeout-sec 5
tcp-keepalive 300

# Pub/Sub and notifications
notify-keyspace-events ""
pubsub-queue-hard-limit 4096
pubsub-queue-soft-limit 2048
pubsub-queue-soft-seconds 60

# Slowlog and latency
slowlog-log-slower-than -1
slowlog-max-len 128
latency-tracking no
